<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estudio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ec4899">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-pink-50 text-gray-800 min-h-screen">

  <div id="login" class="hidden fixed inset-0 z-50 bg-white flex flex-col items-center justify-center gap-4">
    <h1 class="text-xl font-bold">Estudio</h1>
    <p class="text-sm text-gray-500">Inicia sesión con tu cuenta de Google</p>
    <div id="gbtn"></div>
  </div>
  <main id="app" class="max-w-xl mx-auto p-4 space-y-4"></main>
 
<script>
const CLIENT_ID='529390183847-jbcnnpkof69dagpe3lti8tj3k6s9jfji.apps.googleusercontent.com';
const BACKEND='https://script.google.com/macros/s/AKfycbxW_zUcLqRIyQg0bZNQqV_yY2uZBIK2l48L5Mt4qy_BU7x4TVZnkMvHaya4bEXzK2CS/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const PASOS={e:['Estudio','1 h'],r1:['Repaso de noche','30 min'],r2:['Repaso rápido','10 min']};
const btn='px-4 py-2 rounded-xl bg-pink-500 text-white text-sm font-semibold active:scale-95';
const btn2='px-4 py-2 rounded-xl bg-white border border-gray-200 text-sm font-semibold active:scale-95';
const card='p-4 rounded-2xl bg-white border border-pink-100';
const show=h=>{$('app').innerHTML=h};
const fallo=(m,volver)=>show(`<div class="${card} text-sm text-rose-700">${esc(m)}</div><button class="${btn2}" onclick="${volver}">Volver</button>`);
let filas=[],S=null;

/* ---- sesión y backend (mismo login y backend que KeepAPP) ---- */
let cred=JSON.parse(localStorage.getItem('est_cred')||'null');
const vigente=()=>cred&&cred.exp*1000>Date.now()+60000;
function login(){return new Promise(ok=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';
 s.onload=()=>{google.accounts.id.initialize({client_id:CLIENT_ID,auto_select:true,callback:r=>{
  const p=JSON.parse(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
  cred={token:r.credential,exp:p.exp};localStorage.setItem('est_cred',JSON.stringify(cred));$('login').classList.add('hidden');ok();}});
  google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large'});$('login').classList.remove('hidden');};
 document.head.appendChild(s);});}
async function api(action,data,reintento){
 if(!vigente())await login();
 const r=await fetch(BACKEND,{method:'POST',body:JSON.stringify(Object.assign({action,token:cred.token},data||{}))});
 const j=JSON.parse(await r.text());
 if(j.status==='auth'&&!reintento){cred=null;localStorage.removeItem('est_cred');return api(action,data,true);}
 if(j.status!=='success')throw new Error(j.message||j.status);
 return j;}

/* ---- pantalla Hoy ---- */
async function inicio(){show('<p class="text-sm">Cargando…</p>');
 try{const j=await api('estudioLeer');filas=j.filas.map(f=>Object.assign({},f,{n:+f.n}));lista();}
 catch(e){fallo(e.message,'inicio()');}}
function lista(){const h=hoy(),t=[];
 ['e','r1','r2'].forEach(p=>filas.forEach(f=>{const pl=f['fecha_'+p];if(!f['ok_'+p]&&pl&&pl<=h)t.push({f,p,pl});}));
 show('<h1 class="text-xl font-bold">Hoy</h1>'+(t.length?t.map(x=>`<button class="${card} w-full text-left" onclick="abrir(${x.f.n},'${x.p}')"><span class="text-xs text-gray-500">${PASOS[x.p][0]} · ${PASOS[x.p][1]}${x.pl<h?' · atrasado':''}</span><span class="block font-medium">T${x.f.n} · ${esc(x.f.tema)}</span></button>`).join(''):`<div class="${card} text-sm">Nada pendiente hoy.</div>`));}

/* ---- sesión de estudio ---- */
async function abrir(n,p){const f=filas.find(x=>x.n===n);S={f,p,n,i:0};show('<p class="text-sm">Preparando la lección con IA… puede tardar un minuto.</p>');
 try{const j=await api('estudioLeccion',{n,tema:f.tema});S.l=j.leccion;S.t=j.tarjetas;}catch(e){return fallo(e.message,'lista()');}
 S.fl=p==='e'?['leer','pregs']:p==='r1'?['libre','kim','cards']:['libre','cards'];paso();}
function paso(){({leer,pregs,libre,kim,cards})[S.fl[S.i]]();}
function sig(){S.i++;S.i<S.fl.length?paso():fin();}
const titulo=()=>`<h1 class="text-lg font-bold">T${S.n} · ${esc(S.f.tema)}</h1>`;
function leer(){const h=S.l.texto.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>x.startsWith('## ')?`<h3 class="font-semibold mt-4">${esc(x.slice(3))}</h3>`:`<p class="text-sm leading-relaxed mt-2">${esc(x)}</p>`).join('');
 show(`${titulo()}<p class="text-xs text-gray-500">Lee con calma (unos 50 min). La IA puede equivocarse: verifica los datos importantes.</p><div class="${card}">${h}</div><button class="${btn}" onclick="sig()">Terminé de leer</button>`);}
function pregs(){show(`${titulo()}<div class="${card}"><p class="text-sm font-semibold">Tus 5 preguntas para el repaso</p>${S.t.map(x=>`<p class="mt-2 text-sm"><b>${esc(x.pregunta)}</b><br><span class="text-gray-600">${esc(x.respuesta)}</span></p>`).join('')}</div><button class="${btn}" onclick="sig()">Marcar estudio como hecho</button>`);}
function libre(){show(`${titulo()}<div class="${card}"><p class="text-sm font-semibold">Recuerdo libre · 5 min</p><p class="text-xs text-gray-500">Escribe todo lo que recuerdes del tema sin mirar nada.</p><textarea rows="8" class="mt-2 w-full border rounded-xl p-2 text-sm"></textarea><details class="mt-2"><summary class="text-xs text-pink-600 cursor-pointer">Ver la lección para comparar</summary><div class="mt-2 text-xs text-gray-600 whitespace-pre-line">${esc(S.l.texto)}</div></details></div><button class="${btn}" onclick="sig()">Siguiente</button>`);}
function kim(){const el=S.l.elementos||[];if(!el.length)return sig();let s=30;
 show(`${titulo()}<div class="${card}"><p class="text-sm font-semibold">Kim’s game · memoriza</p><ul class="mt-2 text-sm list-disc pl-5">${el.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p id="kc" class="mt-2 text-xs text-gray-500">30 s</p></div>`);
 const iv=setInterval(()=>{s--;if(s>0){$('kc').textContent=s+' s';return;}clearInterval(iv);
  show(`${titulo()}<div class="${card}"><p class="text-sm font-semibold">Escribe los que recuerdes</p><textarea rows="6" class="mt-2 w-full border rounded-xl p-2 text-sm"></textarea></div><button class="${btn}" onclick="kimRev()">Comparar</button>`);},1000);}
function kimRev(){show(`${titulo()}<div class="${card}"><p class="text-sm font-semibold">Eran:</p><ul class="mt-2 text-sm list-disc pl-5">${S.l.elementos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><button class="${btn}" onclick="sig()">Siguiente</button>`);}
function cards(){let c=S.t;if(S.p==='r2'){const d=c.filter(x=>x.caja<=1);if(d.length)c=d;}S.c=c;S.k=0;carta();}
function carta(){const x=S.c[S.k];if(!x)return sig();
 show(`<p class="text-xs text-gray-500">Tarjeta ${S.k+1} de ${S.c.length} · caja ${x.caja}</p><div class="${card}"><p class="font-medium">${esc(x.pregunta)}</p><p id="rs" class="hidden mt-3 text-sm text-gray-700">${esc(x.respuesta)}</p></div><button id="vr" class="${btn}" onclick="$('rs').classList.remove('hidden');$('vr').classList.add('hidden');$('ac').classList.remove('hidden')">Ver respuesta</button><div id="ac" class="hidden flex gap-2"><button class="${btn}" onclick="res(1)">Acerté</button><button class="${btn2}" onclick="res(0)">Fallé</button></div>`);}
function res(a){const x=S.c[S.k];api('estudioResultado',{id:x.id,acierto:a}).catch(()=>{});x.caja=a?Math.min(3,x.caja+1):1;S.k++;carta();}
async function fin(){try{await api('estudioMarcar',{n:S.n,paso:S.p,valor:hoy()});S.f['ok_'+S.p]=hoy();
 show(`<div class="${card} text-sm">Listo. Quedó registrado también en KeepAPP.</div><button class="${btn}" onclick="lista()">Volver</button>`);}catch(e){fallo(e.message,'lista()');}}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:',e)));
inicio();
</script>
</body>
</html>
